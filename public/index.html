<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --text: #e5e5e5;
      --muted: #888;
      --accent: #4ade80;
      --accent-hover: #22c55e;
      --error: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0 0 24px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      background: #0f0f0f;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #0f0f0f;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      padding: 14px;
      background: #0f0f0f;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: none;
    }

    #result.visible {
      display: block;
    }

    #result.error {
      border-color: var(--error);
    }

    .result-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      word-break: break-all;
    }

    .result-row a {
      color: var(--accent);
      flex: 1;
    }

    .copy-btn {
      width: auto;
      padding: 6px 10px;
      font-size: 0.75rem;
      background: var(--border);
      color: var(--text);
    }

    .copy-btn:hover {
      background: #3a3a3a;
    }

    .error-message {
      color: var(--error);
      font-size: 0.85rem;
      margin: 0;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Cole uma URL longa e receba um link curto.</p>

    <form id="shorten-form">
      <label for="url">URL original</label>
      <input
        type="url"
        id="url"
        placeholder="https://exemplo.com/pagina-bem-longa"
        required
      />
      <button type="submit" id="submit-btn">Encurtar</button>
    </form>

    <div id="result"></div>

    <footer>
      API REST em Node.js + TypeScript + Prisma —
      <a href="https://github.com/Marc0l4/url-shortener" target="_blank">código fonte</a>
    </footer>
  </div>

  <script>
    const form = document.getElementById('shorten-form');
    const urlInput = document.getElementById('url');
    const submitBtn = document.getElementById('submit-btn');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Encurtando...';
      result.className = '';

      try {
        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ originalUrl: urlInput.value }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro ao encurtar a URL.');
        }

        result.innerHTML = `
          <div class="result-row">
            <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>
            <button class="copy-btn" onclick="copyLink('${data.shortUrl}')">Copiar</button>
          </div>
        `;
        result.classList.add('visible');
        urlInput.value = '';
      } catch (error) {
        result.innerHTML = `<p class="error-message">${error.message}</p>`;
        result.classList.add('visible', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Encurtar';
      }
    });

    function copyLink(link) {
      navigator.clipboard.writeText(link);
      event.target.textContent = 'Copiado!';
      setTimeout(() => { event.target.textContent = 'Copiar'; }, 1500);
    }
  </script>
</body>
</html>
